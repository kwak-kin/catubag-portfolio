    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Theme Toggle Inline Prevention Script -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-cream-200 text-olive-500 transition-colors duration-300 dark:bg-olive-500 dark:text-cream-200 font-sans selection:bg-olive-500 selection:text-cream-200 dark:selection:bg-cream-200 dark:selection:text-olive-500">

  </body>
